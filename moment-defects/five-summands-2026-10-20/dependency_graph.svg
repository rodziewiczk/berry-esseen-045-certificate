<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Five summands and the separate conditional continuation</title>
  <desc id="desc">Two upward dependency chains. The left proves C5 less than or equal to CE from the published C4 bound, Prawitz and Shevtsova, continuous companion proofs, and exact complete covers. An independent gap-free Cantelli branch does not assume contact or support. The right uses a separate coarse C5 seed, retained assumptions A6 and F, and T10, to obtain strict bounds at every index at least six. There is no edge from sharp C5 to that conditional chain and no unconditional all-index theorem.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#46657a"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a66b1e"/></marker>
    <style>
      text {font-family: "Segoe UI", "DejaVu Sans", Arial, sans-serif; fill: #213748; font-size: 18px;}
      .heading {font-size: 25px; font-weight: 650;}
      .subhead {font-size: 15px; fill: #5d6d77;}
      .main {font-size: 24px; font-weight: 650;}
      .small {font-size: 15px;}
      .tiny {font-size: 14px;}
      .box {fill: #f3f8fc; stroke: #7195ae; stroke-width: 1.5;}
      .proved {fill: #e7f4ea; stroke: #43845a; stroke-width: 2;}
      .conditional {fill: #fff4dd; stroke: #b57925; stroke-width: 1.8; stroke-dasharray: 7 5;}
      .proof {fill: #f1edf8; stroke: #9276b1; stroke-width: 1.5;}
      .published {fill: #edf1f4; stroke: #7b8e9b; stroke-width: 1.5;}
      .edge {fill: none; stroke: #46657a; stroke-width: 1.8; marker-end: url(#arrow);}
      .condedge {fill: none; stroke: #a66b1e; stroke-width: 1.8; marker-end: url(#orangeArrow);}
      .bus {fill: none; stroke: #a66b1e; stroke-width: 1.4; stroke-dasharray: 5 4;}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="35" class="heading">Five summands and the separate conditional continuation</text>
  <text x="40" y="60" class="subhead">Premises below; conclusions above. Arrows denote mathematical dependencies, not file-integrity checks.</text>
  <line x1="715" y1="80" x2="715" y2="852" stroke="#d4dce1" stroke-dasharray="5 7"/>

  <!-- Upward edges are drawn behind the node boxes. -->
  <path class="edge" d="M365 215 L365 170"/>
  <path class="edge" d="M235 350 L235 285"/>
  <path class="edge" d="M575 350 L575 285"/>
  <path class="edge" d="M235 490 L235 430"/>
  <path class="edge" d="M235 620 L235 565"/>
  <path class="edge" d="M135 780 L135 705"/>
  <path class="edge" d="M360 780 L445 760 L445 585 L390 565"/>
  <path class="edge" d="M460 650 L445 650 L445 585 L410 565"/>
  <path class="edge" d="M575 620 L575 590 L445 590 L445 450 L400 430"/>
  <path class="edge" d="M575 490 L575 460"/>

  <path class="condedge" d="M935 225 L935 170"/>
  <path class="condedge" d="M935 325 L935 285"/>
  <path class="condedge" d="M935 425 L935 385"/>
  <path class="condedge" d="M935 525 L935 485"/>
  <path class="condedge" d="M935 635 L935 585"/>
  <path class="condedge" d="M935 780 L935 710"/>
  <path class="condedge" d="M1255 215 L1255 170"/>
  <path class="condedge" d="M470 815 L720 815 L720 735 L750 700"/>
  <path class="bus" d="M1140 780 L1140 255"/>
  <path class="condedge" d="M1140 255 L1120 255"/>
  <path class="condedge" d="M1140 355 L1120 355"/>
  <path class="condedge" d="M1140 455 L1120 455"/>
  <path class="condedge" d="M1140 555 L1120 555"/>

  <!-- Sharp fifth-index chain. -->
  <rect x="40" y="90" width="650" height="80" rx="8" class="proved"/>
  <text x="365" y="123" text-anchor="middle" class="main">C₅ ≤ C_E</text>
  <text x="365" y="150" text-anchor="middle" class="small">From the published unrestricted fourth-index bound</text>

  <rect x="40" y="215" width="650" height="70" rx="7" class="box"/>
  <text x="365" y="243" text-anchor="middle">Complete closed moment / probability cover</text>
  <text x="365" y="267" text-anchor="middle" class="small">Continuous implications + exact arithmetic + all boundary seams</text>

  <rect x="40" y="350" width="390" height="80" rx="7" class="box"/>
  <text x="235" y="378" text-anchor="middle">Acquired physical gap and resources</text>
  <text x="235" y="404" text-anchor="middle" class="small">Same-law count bounds; all six original roots</text>

  <rect x="460" y="350" width="230" height="110" rx="7" class="proved"/>
  <text x="575" y="375" text-anchor="middle">Independent gap-free</text>
  <text x="575" y="400" text-anchor="middle">sign-count / Cantelli</text>
  <text x="575" y="426" text-anchor="middle" class="small">All real thresholds;</text>
  <text x="575" y="447" text-anchor="middle" class="small">no C₄, contact or support</text>

  <rect x="40" y="490" width="390" height="75" rx="7" class="box"/>
  <text x="235" y="520" text-anchor="middle">Support, then same-law Fourier</text>
  <text x="235" y="545" text-anchor="middle" class="small">Before higher moments are used</text>

  <rect x="460" y="490" width="230" height="75" rx="7" class="box"/>
  <text x="575" y="516" text-anchor="middle">Signwise moments</text>
  <text x="575" y="541" text-anchor="middle" class="small">Exact closed-box cover</text>

  <rect x="40" y="620" width="390" height="85" rx="7" class="box"/>
  <text x="235" y="647" text-anchor="middle">Attainment, reflection and contact</text>
  <text x="235" y="674" text-anchor="middle">q₅ = 0 on the contrary branch</text>
  <text x="235" y="695" text-anchor="middle" class="small">One unrestricted maximizing marginal</text>

  <rect x="460" y="620" width="230" height="105" rx="7" class="proof"/>
  <text x="575" y="646" text-anchor="middle">45 companion</text>
  <text x="575" y="671" text-anchor="middle">continuous-proof sources</text>
  <text x="575" y="695" text-anchor="middle" class="small">Actual analytic obligations,</text>
  <text x="575" y="715" text-anchor="middle" class="small">not “hashes imply truth”</text>

  <rect x="40" y="780" width="190" height="70" rx="7" class="published"/>
  <text x="135" y="807" text-anchor="middle">Published C₄ ≤ C_E</text>
  <text x="135" y="832" text-anchor="middle" class="small">Unrestricted laws</text>

  <rect x="250" y="780" width="220" height="70" rx="7" class="published"/>
  <text x="360" y="807" text-anchor="middle">Prawitz + Shevtsova</text>
  <text x="360" y="832" text-anchor="middle" class="small">Smoothing / iid estimates</text>

  <!-- Separate conditional continuation; deliberately no sharp-C5 edge. -->
  <rect x="740" y="90" width="620" height="80" rx="8" class="conditional"/>
  <text x="1050" y="123" text-anchor="middle" class="main">Cₙ &lt; C_E for every n ≥ 6</text>
  <text x="1050" y="150" text-anchor="middle">UNDER the retained A₆, F and T₁₀ hypotheses</text>

  <rect x="750" y="225" width="370" height="60" rx="7" class="conditional"/>
  <text x="935" y="251" text-anchor="middle">G₉ : C₉ &lt; C_E</text>
  <text x="935" y="273" text-anchor="middle" class="small">Own-index acquisitions; q₉ = 0</text>

  <rect x="1160" y="215" width="200" height="85" rx="7" class="conditional"/>
  <text x="1260" y="242" text-anchor="middle">T₁₀ : Cₙ &lt; C_E</text>
  <text x="1260" y="265" text-anchor="middle">for n ≥ 10</text>
  <text x="1260" y="287" text-anchor="middle" class="tiny">Retained conditional tail</text>

  <rect x="750" y="325" width="370" height="60" rx="7" class="conditional"/>
  <text x="935" y="351" text-anchor="middle">G₈ : C₈ &lt; C_E</text>
  <text x="935" y="373" text-anchor="middle" class="small">Own-index acquisitions; q₈ = 0</text>

  <rect x="750" y="425" width="370" height="60" rx="7" class="conditional"/>
  <text x="935" y="451" text-anchor="middle">G₇ : C₇ &lt; C_E</text>
  <text x="935" y="473" text-anchor="middle" class="small">Own-index acquisitions; q₇ = 0</text>

  <rect x="750" y="525" width="370" height="60" rx="7" class="conditional"/>
  <text x="935" y="551" text-anchor="middle">G₆ : C₆ &lt; C_E</text>
  <text x="935" y="573" text-anchor="middle" class="small">Own-index acquisitions; q₆ = 579/5000</text>

  <rect x="750" y="635" width="370" height="75" rx="7" class="conditional"/>
  <text x="935" y="663" text-anchor="middle">Independent coarse seed</text>
  <text x="935" y="690" text-anchor="middle">C₅ &lt; 429/1000, within A₆ and F</text>

  <text x="1170" y="400" class="small">A₆ and F are used</text>
  <text x="1170" y="424" class="small">at every finite index.</text>
  <text x="1170" y="484" class="small">No sharp C₅ input;</text>
  <text x="1170" y="508" class="small">no monotonicity in n.</text>

  <rect x="750" y="780" width="610" height="70" rx="7" class="conditional"/>
  <text x="1055" y="807" text-anchor="middle">Retained A₆ and F: analytic reductions and uniform bounds</text>
  <text x="1055" y="832" text-anchor="middle" class="small">Same-law acquisition, full closed covers, count majorants and remainders</text>

  <text x="40" y="882" class="small">Scope: non-strict C₅ theorem on the left; explicitly conditional tail on the right. No unconditional C* = C_E conclusion is asserted.</text>
</svg>
