[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "berry-esseen-045-verification"
version = "1.2.0"
description = "Rigorous interval verification for a 0.45 Berry-Esseen bound"
readme = "README.md"
requires-python = "==3.12.4"
license = { file = "LICENSE" }
authors = [
  { name = "Kacper Rodziewicz" },
]
keywords = [
  "Berry-Esseen inequality",
  "computer-assisted proof",
  "interval arithmetic",
  "rigorous numerics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy==1.26.4",
  "python-flint==0.9.0",
]

[project.scripts]
berry-esseen-verify = "construction.verify:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["construction*", "proof*", "reproduction*"]
