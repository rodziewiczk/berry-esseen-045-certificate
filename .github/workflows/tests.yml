name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-control-plane:
    name: Replay control-plane tests (not proof verification)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python 3.12.4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.4
      - name: Run lightweight controller and corruption tests only
        working-directory: moment-defects/reproduction
        run: python -B -S -m unittest discover -s all_indices -t . -p 'test_*.py' -v

      - name: Test new sub-DAG controllers (not mathematical replay)
        working-directory: moment-defects
        run: python -B -S -m unittest discover -s reproduction/continuations -t . -p 'test_*.py' -v

      - name: Test full-tail invocation and conditional composition schemas
        working-directory: moment-defects
        run: python -B -S -m unittest reproduction.uniform_tail.test_tail_adapters reproduction.uniform_tail.test_component40 reproduction.c5_composition.test_semantics -v

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - name: Set up Python 3.12.4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.4
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install formal runtime
        run: python -m pip install --requirement requirements.txt

      - name: Validate project metadata
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))"

      - name: Compile Python packages
        run: python -m compileall -q construction proof reproduction

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate verification entry point
        run: python -m construction.verify --help

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - name: Build verifier image
        run: docker build --tag berry-esseen-045-verifier:test .
